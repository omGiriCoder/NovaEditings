<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor Dashboard – Nova Editings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="editor-dashboard.css">
</head>
<body>

<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">Nova<span>Editings</span></h2>

        <nav>
            <a class="active">Overview</a>
            <a>Profile</a>
            <a>Jobs</a>
            <a>Portfolio</a>
        </nav>

        <button class="logout" id="logoutBtn">Logout</button>
    </aside>

    <!-- Main -->
    <main class="main">
        <h1>Welcome, Editor 👋</h1>
        <p class="subtitle">Find high-paying video editing jobs</p>

        <!-- Stats -->
        <div class="stats">
            <div class="card">
                <h3>12</h3>
                <p>Jobs Applied</p>
            </div>
            <div class="card">
                <h3>3</h3>
                <p>Active Projects</p>
            </div>
            <div class="card">
                <h3>₹45,000</h3>
                <p>Total Earnings</p>
            </div>
        </div>

        <!-- Jobs -->
        <section class="section">
            <h2>Recent Job Listings</h2>

            <div class="job">
                <div>
                    <h3>YouTube Video Editor</h3>
                    <p>Budget: ₹5,000 – ₹8,000</p>
                </div>
                <button>Apply</button>
            </div>

            <div class="job">
                <div>
                    <h3>Reels & Shorts Editor</h3>
                    <p>Budget: ₹2,000 / video</p>
                </div>
                <button>Apply</button>
            </div>
        </section>
    </main>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="firebase-auth.js"></script>
<script src="route-guard.js"></script>
<script src="editor-dashboard.js"></script>

<script>
    protectRoute("editor");
</script>

</body>
</html>
