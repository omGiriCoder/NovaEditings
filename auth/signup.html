<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up – Nova Editings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="auth.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="auth-container">
    <h2>Create Your Account</h2>
    <p>Join Nova Editings and work with premium clients</p>

    <!-- Google Sign Up -->
    <button class="google-btn" onclick="googleLogin()">
        Sign up with Gmail
    </button>

    <div class="divider">OR</div>

    <!-- Phone Signup -->
    <input type="text" id="name" placeholder="Full Name">
    <input type="tel" id="phone" placeholder="Phone Number (+91XXXXXXXXXX)">

    <div id="recaptcha"></div>

    <button class="primary-btn" onclick="sendOTP()">
        Send OTP
    </button>

    <!-- OTP Section -->
    <input type="text" id="otp" placeholder="Enter OTP" style="display:none">
    <button class="primary-btn" id="verifyBtn" onclick="verifyOTP()" style="display:none">
        Verify & Create Account
    </button>

    <p class="switch">
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</div>

<!-- Auth Logic -->
<script src="firebase-auth.js"></script>
</body>
</html>
