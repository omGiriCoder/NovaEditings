<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Nova Editings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    <h2>Welcome Back</h2>

    <button class="google-btn" onclick="googleLogin()">
        Continue with Gmail
    </button>

    <div class="divider">OR</div>
</div>

<!-- ✅ Firebase SDKs (ORDER MATTERS) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- ✅ Your Firebase init + auth -->
<script src="firebase-auth.js"></script>

<!-- ✅ AUTO-REDIRECT (FINAL, WORKING VERSION) -->
<script>
  const unsubscribe = firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) return;

    // stop listening immediately
    unsubscribe();

    const db = firebase.firestore();
    const snap = await db.collection("users").doc(user.uid).get();

    if (!snap.exists || !snap.data().role) {
      window.location.replace("role-selection.html");
      return;
    }

    const role = snap.data().role;

    if (role === "admin") {
      window.location.replace("admin-dashboard.html");
    } else if (role === "client") {
      window.location.replace("client-dashboard.html");
    } else if (role === "editor") {
      window.location.replace("editor-dashboard.html");
    }
  });
</script>

</body>
</html>
