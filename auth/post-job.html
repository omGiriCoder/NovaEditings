<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post a Job – Nova Editings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="client-dashboard.css">
</head>
<body>

<div class="dashboard">

  <aside class="sidebar">
    <h2 class="logo">Nova<span>Editings</span></h2>

    <nav>
      <a href="client-dashboard.html" class="nav-link">← Back</a>
    </nav>
  </aside>

  <main class="main">
    <h1>Post a New Job</h1>
    <p class="subtitle">Describe your project clearly to get better editors</p>

    <div class="card">
      <input id="title" placeholder="Job title (e.g. YouTube Video Editor)" />
      <textarea id="description" placeholder="Describe your project requirements"></textarea>

      <div class="row">
        <input id="budget" type="number" placeholder="Budget (₹)" />
        <input id="deadline" type="date" />
      </div>

      <button onclick="postJob()">Post Job</button>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="firebase-auth.js"></script>
<script src="route-guard.js"></script>
<script src="client-dashboard.js"></script>

<script>protectRoute("client");</script>
</body>
</html>
