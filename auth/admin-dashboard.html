<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – Nova Editings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Nova<span>Editings</span></h2>

    <nav>
      <a class="nav-link active" data-view="new">New Jobs</a>
      <a class="nav-link" data-view="progress">In Progress</a>
      <a class="nav-link" data-view="payments">Pending Payments</a>
      <a class="nav-link" data-view="completed">Completed</a>
      <a class="nav-link" data-view="settings">Settings</a>
    </nav>

    <button class="logout" id="logoutBtn">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main" id="content"></main>

</div>

<div id="toast" class="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="firebase-auth.js"></script>
<script src="route-guard.js"></script>
<script src="admin-dashboard.js"></script>          

<script>
  protectRoute("admin");
</script>

</body>
</html>
