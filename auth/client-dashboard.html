<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Client Dashboard — Nova Editings</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="client-dashboard.css">
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Nova<span>Editings</span></h2>

    <nav>
      <a class="nav-link active" data-view="overview">Overview</a>
      <a class="nav-link" data-view="post">Post Job</a>
      <a class="nav-link" data-view="jobs">Posted Jobs</a>
      <a class="nav-link" data-view="settings">Settings</a>
    </nav>

    <button class="logout" id="logoutBtn">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main" id="content">
    <!-- content injected by JS -->
  </main>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase SDKs (compat style) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Provide your firebase-auth.js which initializes firebase, auth and db -->
<script src="firebase-auth.js"></script>
<script src="route-guard.js"></script>
<script src="client-dashboard.js"></script>

<script>
  // protect the page, ensure only clients can enter (route-guard.js)
  protectRoute("client");
</script>

</body>
</html>
