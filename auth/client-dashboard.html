<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Dashboard – Nova Editings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="client-dashboard.css">
</head>
<body>

<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">Nova<span>Editings</span></h2>

        <nav>
            <a class="active">Overview</a>
            <a>Post Job</a>
            <a>My Jobs</a>
            <a>Hired Editors</a>
        </nav>

        <button class="logout" id="logoutBtn">Logout</button>
    </aside>

    <!-- Main -->
    <main class="main">
        <h1>Welcome, Client 👋</h1>
        <p class="subtitle">Post jobs and hire top video editors</p>

        <!-- Stats -->
        <div class="stats">
            <div class="card">
                <h3>8</h3>
                <p>Jobs Posted</p>
            </div>
            <div class="card">
                <h3>2</h3>
                <p>Active Hires</p>
            </div>
            <div class="card">
                <h3>₹62,000</h3>
                <p>Total Spend</p>
            </div>
        </div>

        <!-- Jobs -->
        <section class="section">
            <h2>Your Recent Job Posts</h2>

            <div class="job">
                <div>
                    <h3>YouTube Long-Form Editor</h3>
                    <p>Status: Accepting Applications</p>
                </div>
                <button>View</button>
            </div>

            <div class="job">
                <div>
                    <h3>Instagram Reels Editor</h3>
                    <p>Status: Editor Hired</p>
                </div>
                <button>View</button>
            </div>

            <button class="post-job">+ Post New Job</button>
        </section>
    </main>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="firebase-auth.js"></script>
<script src="route-guard.js"></script>
<script src="client-dashboard.js"></script>

<script>
    protectRoute("client");
</script>

</body>
</html>
